<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille quotidienne — MonRhumato</title>
<style>
  :root { --teal:#2dc4b5; --teal-dark:#1fa396; --ink:#1e2a32; --muted:#67757e; --bg:#f4f7f8; --card:#ffffff; --border:#e2e9ec; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header h1 { font-size:1.5rem; color:var(--teal-dark); }
  header p { color:var(--muted); font-size:.92rem; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-top:18px; }
  .item { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .item:hover b { color:var(--teal-dark); }
  .item small { color:var(--muted); white-space:nowrap; }
  .report { font-size:.95rem; overflow-wrap:break-word; }
  .report h1,.report h2,.report h3 { margin:16px 0 6px; color:var(--teal-dark); }
  .report h1 { font-size:1.25rem; } .report h2 { font-size:1.1rem; } .report h3 { font-size:1rem; }
  .report p { margin:8px 0; }
  .report ul,.report ol { margin:8px 0 8px 22px; }
  .report a { color:var(--teal-dark); }
  .report pre { background:#f4f7f8; padding:10px; border-radius:8px; overflow-x:auto; font-size:.85rem; margin:8px 0; }
  .report code { background:#f4f7f8; padding:1px 4px; border-radius:4px; font-size:.88em; }
  .back { display:inline-block; margin-bottom:10px; color:var(--teal-dark); cursor:pointer; font-size:.9rem; background:none; border:none; font-weight:600; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 Veille quotidienne multi-IA</h1>
    <p>Synthèses comparatives des recherches approfondies ChatGPT, Gemini et Claude, publiées automatiquement chaque matin.</p>
  </header>
  <div class="card" id="content"><p class="empty">Chargement…</p></div>
</div>

<script>
// Les synthèses sont lues en direct depuis le dépôt GitHub public :
// pas besoin de redéployer Vercel quand un nouveau rapport est commité.
const RAW = "https://raw.githubusercontent.com/schemoul2/monrhumato-archive/main/";
const $ = s => document.querySelector(s);
let index = [];

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src) {
  return esc(src).split(/\n{2,}/).map(b => {
    if (/^```/.test(b)) return "<pre>" + b.replace(/^```\w*\n?|```$/g,"") + "</pre>";
    if (/^#{1,3}\s/.test(b)) { const n = b.match(/^#+/)[0].length; return `<h${n}>${b.replace(/^#+\s*/,"")}</h${n}>`; }
    if (/^(\s*[-*+]\s)/m.test(b)) return "<ul>" + b.split(/\n/).map(l => l.replace(/^\s*[-*+]\s+(.*)/, "<li>$1</li>")).join("") + "</ul>";
    if (/^(\s*\d+[.)]\s)/m.test(b)) return "<ol>" + b.split(/\n/).map(l => l.replace(/^\s*\d+[.)]\s+(.*)/, "<li>$1</li>")).join("") + "</ol>";
    return "<p>" + b.replace(/\n/g,"<br>") + "</p>";
  }).join("")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function showList() {
  $("#content").innerHTML = index.length
    ? index.map((r, i) => `<div class="item" onclick="showReport(${i})"><b>${esc(r.titre || "Synthèse")}</b><small>${esc(r.date)}</small></div>`).join("")
    : '<p class="empty">Aucune synthèse publiée pour le moment — la première arrivera demain matin.</p>';
}

async function showReport(i) {
  $("#content").innerHTML = '<p class="empty">Chargement…</p>';
  try {
    const text = await (await fetch(RAW + index[i].file)).text();
    $("#content").innerHTML = `<button class="back" onclick="showList()">← Toutes les synthèses</button><div class="report">${md(text)}</div>`;
    window.scrollTo(0, 0);
  } catch { $("#content").innerHTML = '<p class="empty">Impossible de charger cette synthèse.</p>'; }
}

fetch(RAW + "rapports/index.json?t=" + Date.now()).then(r => r.json()).then(d => { index = d; showList(); })
  .catch(() => { $("#content").innerHTML = '<p class="empty">Index introuvable.</p>'; });
</script>
</body>
</html>
