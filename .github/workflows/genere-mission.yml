# Génération de la mission de veille — MonRhumato.fr
# Chaque matin avant les tâches ChatGPT/Gemini (6h Paris) : agrège les actualités
# des flux RSS rhumato et publie mission.txt à la racine du dépôt (public).
# Les moteurs Deep Research la lisent via :
# https://raw.githubusercontent.com/schemoul2/monrhumato-archive/main/mission.txt

name: Génération mission de veille

on:
  schedule:
    - cron: "23 3 * * *" # ~05h23 Paris (03:23 UTC) — avant les tâches de 6h
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer mission.txt
        run: node scripts/genere-mission.js

      - name: Publier
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add mission.txt
          git diff --cached --quiet && echo "Mission inchangée." && exit 0
          git commit -m "Mission de veille du $(date +%F)"
          git push
